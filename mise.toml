[dotfiles]
"~/.gitconfig"        = "git/gitconfig"
"~/.gitignore_global" = "git/gitignore_global"
"~/.config/mise"      = "mise"
"~/.config/nvim"      = "nvim"
"~/.gemrc"            = "rails/gemrc"
"~/.irbrc"            = "rails/irbrc"
"~/.railsrc"          = "rails/railsrc"
"~/.rspec"            = "rails/rspec"
"~/.hushlogin"        = "system/hushlogin"
"~/.screenshot-clipboard.sh" = "system/screenshot-clipboard.sh"
"~/Library/LaunchAgents/com.damireh.screenshot-clipboard.plist" = "system/com.damireh.screenshot-clipboard.plist"
"~/.tmux.conf"        = "tmux/tmux.conf"
"~/.aliasrc"          = "zsh/aliasrc"
"~/.zshenv"           = "zsh/zshenv"
"~/.zshrc"            = "zsh/zshrc"

[bootstrap.macos.dock]
show_recents = false

[bootstrap.macos.finder]
show_extensions_warning = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyleSwitchesAutomatically = true
AppleActionOnDoubleClick = "Minimize"
"com.apple.swipescrolldirection" = false
NSAutomaticCapitalizationEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
NSAutomaticInlinePredictionEnabled = false
WebAutomaticSpellingCorrectionEnabled = false

[bootstrap.macos.defaults."com.apple.dock"]
minimize-to-application = true

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfHm"
_FXSortFoldersFirst = true
WarnOnEmptyTrash = false
ShowExternalHardDrivesOnDesktop = false
ShowRemovableMediaOnDesktop = false

[bootstrap.macos.defaults."com.apple.screencapture"]
location = "~/Pictures/Screenshots"
# newer macOS reads this key (set by ⌘⇧5 > Options) instead of `location`
location-screenshot = "~/Pictures/Screenshots"
show-thumbnail = false

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableTiledWindowMargins = false
EnableTilingByEdgeDrag = false
EnableTopTilingByEdgeDrag = false
EnableTilingOptionAccelerator = false
StandardHideWidgets = true

[bootstrap.macos.defaults."com.apple.TextInputMenu"]
visible = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

[bootstrap.macos.defaults."com.apple.Terminal"]
"Default Window Settings" = "Smyck"
"Startup Window Settings" = "Smyck"

# import before defaults set Smyck as the default profile
[bootstrap.hooks.pre-defaults]
description = "Import the Smyck Terminal profile if it is missing"
run = """
/usr/libexec/PlistBuddy -c 'Print :"Window Settings":Smyck:name' ~/Library/Preferences/com.apple.Terminal.plist >/dev/null 2>&1 \
  || open "{{config_root}}/system/Smyck.terminal"
"""
